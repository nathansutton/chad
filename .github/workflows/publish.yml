name: publish

# PyPI trusted publishing (OIDC): no API tokens are stored in the repo. The publisher
# must be configured on PyPI for project chad-code, owner nathansutton, repo chad,
# workflow publish.yml, environment pypi (a one-time operator step).
# Triggered by version tags only, so a release is always a deliberate `git tag` push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # pure-python wheel; no MLX import happens during build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # gate: environment protection = the manual-approval knob
    permissions:
      id-token: write        # OIDC for trusted publishing (this job only)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      # pypa recommends the floating @release/v1 tag for convenience, but this is the
      # one step that runs under `id-token: write`: a repointed tag could publish under
      # the project's own trusted-publishing identity. So pin the commit instead — the
      # SHA below is the release/v1 head, which at pin time was release v1.14.2 — and
      # let Dependabot move it, reviewed like any other dependency bump. The action
      # reads the OIDC token minted above and needs no stored credentials.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
