name: tests

# Apple Silicon only: MLX builds/runs on arm64 macOS, so every job that imports
# chad runs on macos-14 (GitHub's arm64 runner). Lint, typecheck and test each run the
# Makefile target of the same name, so CI checks exactly what the docs tell contributors
# to run. The fast unit gate loads NO model and finishes in seconds; the tier-2
# proxy-model tests are opt-in and not run here — run
# `CHAD_MODEL_TESTS=1 uv run pytest -q tests/test_engine.py` on a Mac with the model
# cached. The private eval tiers are the maintainer's and are not in this repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # ruff is platform-independent, so it runs on the cheap Linux runner like the `lock`
    # job, not the ~10×-pricier macos-14. mypy does NOT run here: see `typecheck`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff (lint + import order)
        run: make lint
      - name: anti-slop (evidence policy; stdlib-only, runs on 3.12)
        run: make slop

  typecheck:
    # mypy runs on macOS because the mlx stubs DO matter: on Linux mlx is not installed,
    # ignore_missing_imports types every mlx symbol as Any, and the check passes vacuously
    # over exactly the engine and kernel modules it should guard — while the same command
    # failed on a Mac. Type-check the environment users actually run. One interpreter is
    # enough: the config pins python 3.11.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --python 3.11
      - name: mypy (src + the polyglot kit; config pins python 3.11)
        # UV_PYTHON carries the interpreter through `make` to its `uv run`.
        env:
          UV_PYTHON: "3.11"
        run: make typecheck

  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Sync dependencies (python ${{ matrix.python }})
        run: uv sync --python ${{ matrix.python }}
      - name: Fast test gate (no model)
        # The suite is model-free by default (its documented contract): the tier-2 cache
        # tests in test_engine.py skip unless CHAD_MODEL_TESTS=1 opts in, so nothing here
        # downloads the 4-bit proxy model. Those byte-exact warm-vs-fresh equality checks
        # flip on quantized argmax near-ties across runner hardware (a numerical tie, not a
        # cache bug — see the sibling quantization-tie skip), and are meant to run locally
        # on real weights. UV_PYTHON carries the matrix interpreter through `make`.
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make test
      - name: CLI smoke (entrypoint imports + parses, no model)
        run: uv run --python ${{ matrix.python }} chad --help

  build:
    # Guards the public install path: `uvx --from git+https://… chad` resolves fresh
    # from PyPI and IGNORES uv.lock. A dep bump that breaks a clean resolve would pass
    # the locked test job but break every new user, so we build the dist and install
    # it into a lock-free venv, then confirm the console script resolves.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Fresh resolve install (no uv.lock) + entrypoint check
        run: |
          uv venv --python 3.11 /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install .
          /tmp/fresh/bin/chad --help
      - name: Every module imports under the fresh resolve
        # `chad --help` exits inside argparse, so it only proves the CLI module tree
        # imports. Modules imported later — mcp/mcp_oauth on the first Agent, speech on
        # /speech — were unguarded by this job, and a fresh resolve that pulled an
        # incompatible SDK crashed on the first real run while CI stayed green. Walk and
        # import EVERY submodule so any import-time break fails here instead of at a
        # user's first prompt.
        run: |
          /tmp/fresh/bin/python -c "
          import importlib, pkgutil, sys, chad
          bad = []
          for m in pkgutil.walk_packages(chad.__path__, 'chad.'):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  bad.append(f'{m.name}: {type(e).__name__}: {e}')
          for b in bad:
              print('IMPORT FAILED', b)
          # chad.mcp/mcp_oauth guard their SDK imports so a bad resolve degrades instead
          # of killing the agent — which would also hide the break from the walk above.
          # Assert the guard did NOT fire: in CI an unusable SDK is a failure, not a
          # graceful degradation.
          import chad.mcp, chad.mcp_oauth
          for mod in (chad.mcp, chad.mcp_oauth):
              if mod._SDK_ERROR:
                  bad.append(f'{mod.__name__}: MCP SDK unusable: {mod._SDK_ERROR}')
                  print('SDK GUARD FIRED', bad[-1])
          sys.exit(1 if bad else 0)
          "

  lock:
    # uv.lock must stay in sync with pyproject.toml. Pure metadata check — no MLX,
    # so it runs on a cheap linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Lockfile is up to date
        run: uv lock --check
