[project]
# Distribution name is `chad-code` (bare `chad` on PyPI is a squatted 2014 package).
# The IMPORT package (src/chad/) and the `chad` command are unchanged — dist name,
# import name, and command name are independent. `uvx chad-code` runs the alias
# script added under [project.scripts].
name = "chad-code"
version = "2.0.1"
description = "Claude-Code-style coding agent that runs entirely on a 24 GB Apple Silicon Mac (MLX, Qwen3.8-27B)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mlx", "coding-agent", "apple-silicon", "local-llm", "tui"]
# No License classifier: the SPDX `license` field above is authoritative (setuptools
# rejects declaring both). Platforms are honest — the wheel is pure-python but the
# mlx/mlx-lm dep tree resolves only on Apple Silicon macOS (cli._preflight hard-stops
# elsewhere), so no cross-platform OS classifier is claimed.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # Upper-bounded on purpose: chad's model loading rides on mlx-lm's qwen3_5/qwen3_5_moe
    # loader (expert-weight stacking + vision-tower strip). A minor bump could refactor it
    # and silently break the `uvx --from git+…` install path, which resolves fresh from
    # PyPI and ignores uv.lock. Stay on the known-good 0.31 line; bump deliberately.
    # Apple-only: no CPU/CUDA build exists. Platform-gated so `pip install chad-code`
    # succeeds on Linux (e.g. a benchmark container) for the remote `--backend llama`
    # path, which loads no MLX. On macOS the default in-process engine installs it as before.
    # mlx 0.32.0: Metal command-buffer failures (incl. OOM) become catchable Python
    # exceptions instead of a SIGABRT (ml-explore/mlx#3523) — engine._prefill/generate
    # lean on that for the on-24GB recovery path. Perf re-gated
    # on the bump: prefill/decode within noise of 0.31.2 on the shipped model.
    # mlx 0.32.1: EXCLUDED — produces degenerate generations with chad's kernel stack
    # (garbage think blocks, repetition loops, hallucinated tasks from the first token;
    # A/B-confirmed 2026-08-23: same wheel, same prompt, sane on ==0.32.0, garbled on
    # ==0.32.1). Point releases must be re-gated against the custom QSDPA/DFlash2/MMA
    # kernels before widening this pin.
    "mlx==0.32.1; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'",
    # mlx-lm requires transformers>=5.0, but 5.13.0 regressed AutoTokenizer.register:
    # it now does `key.__module__.startswith("transformers.")` with no hasattr guard, and
    # mlx-lm's tokenizer_utils passes the *string* "NewlineTokenizer" as config_class →
    # AttributeError at import. Cap below 5.13 until mlx-lm or transformers fixes it.
    "transformers>=5.0,<5.13",
    # transformers needs jinja2 to render `apply_chat_template` (chad's `_render` on every
    # backend). It's an OPTIONAL transformers dep — present transitively on a dev Mac but
    # absent in a clean install (e.g. chad inside a Linux benchmark container), where its
    # absence crashes the first turn. Declare it directly.
    "jinja2>=3.1",
    # <3: the old <2 cap was 1.0.0-era caution, not a known break. numpy 2.4.6
    # verified end-to-end (full gate + live Parakeet-on-MLX transcription +
    # `chad prove` 4/4); staying open keeps 2.x-floored ASR deps adoptable.
    "numpy>=1.26,<3",
    "huggingface-hub>=1.22.0", # first-run model download (cli.py/engine.py); imported directly, not just transitively
    "prompt_toolkit>=3.0.43",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.12.2",
    # Single 2.x code path (the 1.x cap left with serena-agent, which hard-pinned mcp
    # and was the only thing keeping chad below 2). The 1->2 port was done deliberately,
    # not by a resolver: two of the renames (isError->is_error, readOnlyHint->
    # read_only_hint) FAIL SILENTLY through getattr defaults, so both are pinned by
    # tests that would fail on the old attribute names (tests/test_mcp.py). 2.0 also
    # negotiates protocol 2026-07-28; the 1.x line tops out at 2025-11-25. Capped <3:
    # the same class of break will happen again.
    "mcp>=2,<3",
]

# Extras ride on the INSTALL SPEC, so the command depends on how chad was installed:
# `uv tool install --force 'chad-code[<extra>]'` (or `uvx --from 'chad-code[<extra>]' chad`)
# for a PyPI install, `uv sync --extra <extra>` only in a clone. speech.install_hint()
# derives the right one at runtime — keep it in step with any extra added here.
# NOTE: the PyPI distribution is `chad-code`; 'pip install chad' installs an unrelated
# squatted package.
#
# Optional syntax highlighting in diffs / confirm previews. Pure-Python,
# import-guarded in render.py: absent, output is byte-identical to the un-highlighted path.
[project.optional-dependencies]
highlight = ["pygments>=2.17"]
# Voice mode (/speech in the TUI): push-to-talk dictation via chad's vendored
# Parakeet-on-MLX (src/chad/parakeet — the PyPI parakeet-mlx drags librosa's
# numba/scipy tree for one mel-filterbank call) + spoken replies via macOS
# `say`. All on-device, nothing leaves the machine. mlx/numpy/huggingface-hub
# are already core deps, so the extra adds only the mic (sounddevice/PortAudio).
# Optional and import-guarded in speech.py: absent, /speech prints the install
# hint and everything else is untouched.
speech = [
    "sounddevice>=0.5",
]

# The one entrypoint: `uv run chad`. (`chad-bench` reproduces docs/benchmarks.md.)
# `chad-code` is an alias so `uvx chad-code` (which runs the console script matching
# the DISTRIBUTION name) just works; the command you actually type stays `chad`.
[project.scripts]
chad = "chad.cli:main"
chad-code = "chad.cli:main"
chad-bench = "chad.bench:main"

[project.urls]
Repository = "https://github.com/nathansutton/chad"
Issues = "https://github.com/nathansutton/chad/issues"

[dependency-groups]
# types-pyyaml: skills.py imports yaml directly; mypy 1.x refuses to honor
# ignore_missing_imports for packages with known typeshed stubs, so the gate
# needs the stubs installed to pass on a plain (no-extra) sync.
# uvicorn: tests/test_mcp.py runs a real Streamable-HTTP MCP server on a loopback
# port to exercise that transport end to end. It arrives transitively through `mcp`
# today, but a transitive import in a test is a collection error waiting to happen —
# `mcp` bounds it (>=0.31.1) and could make it optional. Declare what the tests import.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6", "uvicorn>=0.31.1"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

# Standard src layout: the importable package lives at src/chad/. setuptools
# auto-discovers it from the src dir below; the installed `chad` console script
# then resolves `chad.cli:main` regardless of cwd.
[tool.setuptools.packages.find]
where = ["src"]

# The vendored Parakeet code is Apache-2.0; its license text must travel with
# the code, wheel included.
[tool.setuptools.package-data]
"chad.parakeet" = ["LICENSE"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# No "-q" here: CI/docs/agents all invoke `pytest -q` explicitly, and stacking the two
# (verbosity -2) suppresses the final "N passed" summary line entirely — an agent
# running the gate then gets output with no verdict in it.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Start tight-but-small and high-signal: pyflakes (F) catches real bugs
# (unused/undefined names, bad imports); E9 (syntax errors); isort (I, auto-fixable).
# The E4/E7 pycodestyle groups are intentionally NOT selected: this codebase
# deliberately uses compound one-liners (`a; b`, `if x: return`) — 44 pre-existing
# E701/E702/E731 hits — so enabling them would force churny, behavior-adjacent edits
# far past this gate's mechanical-change limit. Expand (B, UP, SIM, E7) in a follow-up.
select = ["F", "E9", "I"]
ignore = ["E741"]  # ambiguous var names (l/I) appear in existing math code

[tool.ruff.lint.per-file-ignores]
# Vendored upstream (see chad/parakeet/__init__.py), kept byte-close for
# future re-syncs — not held to chad's own lint standard. (F401: imports left
# in place for upstream fidelity after the transcribe(path) cut.)
"src/chad/parakeet/*" = ["F401", "F821", "F841", "E741"]
# Importing a pytest fixture by name and then taking it as a test parameter is the
# standard cross-module fixture idiom, but it reads to pyflakes as the parameter
# shadowing the import (F811). The import itself already carries a `# noqa: F401`.
"tests/test_engine_pld_wide.py" = ["F811"]

[tool.mypy]
python_version = "3.11"
files = ["src/chad"]
ignore_missing_imports = true   # mlx/tree_sitter/mcp ship partial or no stubs
warn_unused_ignores = true
implicit_optional = true        # `x: T = None` defaults are idiomatic throughout; this
                                # restores the pre-PEP-484 reading rather than rewriting
                                # ~10 signatures to Optional[...] for a no-op annotation.
# Lenient first pass: no --strict. `var-annotated` only flags empty-container vars whose
# element type mypy can't infer (e.g. `box = {}`); it's low-signal and clearing it would
# touch ~20 unrelated lines, so it's disabled now and re-enabled in the tightening pass.
disable_error_code = ["var-annotated"]
# Tighten (disallow_untyped_defs, re-enable var-annotated, add B/UP/SIM in ruff) in a
# follow-up once this baseline holds.

[[tool.mypy.overrides]]
# Vendored upstream inference code (see chad/parakeet/__init__.py) is not held
# to chad's gate so re-syncs stay a plain re-copy.
module = "chad.parakeet.*"
ignore_errors = true

[[tool.mypy.overrides]]
# This module patches mlx_lm classes that only exist on macOS: with mlx installed
# (dev Macs, the macos CI jobs) its `type: ignore[method-assign]` comments are load-
# bearing; on the Linux lint runner mlx_lm is absent, the patched classes type as Any,
# and warn_unused_ignores flags those same comments — unfixable in the code for both
# platforms at once, so the unused-ignore warning alone is relaxed for it. (mlx_qsdpa
# patches a module-level function, not a class method, so it needs no relaxation.)
# mlx_qmm_mma patches the same way; engine's ignore sits on an mlx tree_flatten call
# that is likewise Any on Linux.
module = ["chad.mlx_fastpath", "chad.mlx_qmm_mma", "chad.engine"]
warn_unused_ignores = false
